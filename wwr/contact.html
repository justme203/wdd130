<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="Contact mE Water Rafting Company for information about our rafting trips and services.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
   <header> 
        <img src="images/z-crossedoars.jpeg" alt="rafting" width="100">
             <nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="trips.html">Trips</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>
 
</nav>

    </header>

    <main>
        <div class="company-info">
        <h1> Contact Us</h1>
        </div>
       
        <div class="contact-container">
             <div class="company-info">
            
            <h2>mE Water Rafting Company</h2>

            <p class="address">Address: Sekyere South, Jamasi-Ashanti, Ghana</p>
            <p class="phone">Phone: +233(0)257176263</p>
            <p class="email">Email: info@mewaterraftingcompany.com</p>
        </div>


            <div class="map-section">
                <iframe
                    class="map"
                    src="https://maps.google.com/maps?q=5.591661,-0.223490&z=15&output=embed">
                </iframe>
            </div>

            <div class="form-section">
                <form class="form">

                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>

                    <p class="radio-question">Message Purpose</p>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="contact-method" value="email" required>
                            Email
                        </label>

                        <label>
                            <input type="radio" name="contact-method" value="phone">
                            Phone
                        </label>

                        <label>
                            <input type="radio" name="contact-method" value="text">
                            Text Message
                        </label>
                    </div>
                  
                    <label for="message"> Message</label>
                    <textarea id="message" name="message" required></textarea>
  <input type="checkbox" name="subscribe" value="subscribe">
                    <label>Please subscribe me to the monthly newsletter</label>
                    <button type="submit">Get in Touch</button>

                </form>
            </div>

        </div>

        <div class="employee-section">
            <h2>Meet Our Team</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/OI(1).jpg" alt="me">
                    <figcaption>mE<br>General Manger</figcaption>
                </figure>

                <figure>
                    <img src="images/OIP(2).jpg" alt="Second employee">
                    <figcaption>Pricilla <br>Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/OIP.jpg" alt="US">
                    <figcaption>Stephanie<br>Customer Service Representative</figcaption>
                </figure>

            </div>
        </div>
    </main>

    <footer> ©2026 😇 Just mE 😇 🌊 mE Water Rafting Company 🌊 
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="facebook img" width="40">
            </a>
            <a href="https://linkedin.com"> 
                <img src="images/linkedin.svg" alt="linked img" width="40">
            
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="instergram img" width="40" >
            </a>
        </nav>
        
    </footer>
</body>
</html>
